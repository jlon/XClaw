name: Package Test Builds

on:
  push:
    paths:
      - '.github/workflows/package-test.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: '要打包的 Git ref（分支 / tag / SHA），留空使用当前默认 ref'
        required: false
        default: ''
      version:
        description: '测试包版本号，留空自动生成 dev 日期版本'
        required: false
        default: ''
      platform:
        description: '测试包平台'
        required: false
        default: all
        type: choice
        options:
          - all
          - mac
          - win
          - linux

permissions:
  contents: read

jobs:
  validate-workflow:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm manual test packaging workflow is healthy
        run: echo "package-test.yml is manual-only; push validation completed successfully."

  package-test:
    if: github.event_name == 'workflow_dispatch' && ((github.event.inputs.platform || 'all') == 'all' || github.event.inputs.platform == matrix.platform)
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      XCLAW_USE_PREINSTALLED_SKILLS_CACHE: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Resolve test package version
        shell: bash
        env:
          TZ: Asia/Shanghai
        run: node scripts/resolve-release-version.mjs --input-version "${{ github.event.inputs.version || '' }}" --channel dev --write-package

      - name: Install dependencies
        run: pnpm install

      - name: Restore preinstalled skills bundle cache
        uses: actions/cache@v4
        with:
          path: build/preinstalled-skills
          key: preinstalled-skills-${{ runner.os }}-${{ hashFiles('resources/skills/preinstalled-manifest.json', 'scripts/bundle-preinstalled-skills.mjs') }}

      - name: Download uv binaries for macOS
        if: matrix.platform == 'mac'
        run: pnpm run uv:download:mac

      - name: Download uv binaries for Windows
        if: matrix.platform == 'win'
        run: pnpm run uv:download:win

      - name: Download uv binaries for Linux
        if: matrix.platform == 'linux'
        run: pnpm run uv:download:linux

      - name: Build macOS test package
        if: matrix.platform == 'mac'
        run: pnpm run package:mac:adhoc

      - name: Build Windows test package
        if: matrix.platform == 'win'
        run: pnpm run package:win

      - name: Build Linux test package
        if: matrix.platform == 'linux'
        run: pnpm run package:linux

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.yml
            !release/builder-debug.yml
          retention-days: 7
